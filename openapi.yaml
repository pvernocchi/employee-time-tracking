openapi: 3.0.3
info:
  title: Employee Time Tracking API
  version: 1.0.0
  description: REST API secured with API keys for employee time tracking operations.
servers:
  - url: /api/v1
security:
  - ApiKeyAuth: []
paths:
  /me:
    get:
      summary: Get authenticated API user
      operationId: getApiUser
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ApiUser'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /time-entries:
    get:
      summary: List time entries for the authenticated user
      operationId: listTimeEntries
      parameters:
        - in: query
          name: start_date
          schema:
            type: string
            format: date
          required: false
          description: Start date in YYYY-MM-DD format
        - in: query
          name: end_date
          schema:
            type: string
            format: date
          required: false
          description: End date in YYYY-MM-DD format
      responses:
        '200':
          description: Time entries list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimeEntry'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /time-entries/active:
    get:
      summary: Get current active time entry
      operationId: getActiveTimeEntry
      responses:
        '200':
          description: Active entry (or null)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/TimeEntry'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /clock-in:
    post:
      summary: Clock in authenticated user
      operationId: clockIn
      responses:
        '201':
          description: Created active time entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TimeEntry'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: User already has an active entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /clock-out:
    post:
      summary: Clock out authenticated user
      operationId: clockOut
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                break_minutes:
                  type: integer
                  minimum: 0
                  maximum: 720
                notes:
                  type: string
      responses:
        '200':
          description: Updated completed time entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TimeEntry'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: No active entry found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /leave-requests:
    get:
      summary: List leave requests for authenticated user
      operationId: listLeaveRequests
      responses:
        '200':
          description: Leave requests list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeaveRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create leave request for authenticated user
      operationId: createLeaveRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leave_type, start_date, end_date]
              properties:
                leave_type:
                  type: string
                  enum: [vacation, sick, personal, unpaid, maternity, paternity, marriage, bereavement, moving, jury_duty, other]
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                reason:
                  type: string
      responses:
        '201':
          description: Leave request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LeaveRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  responses:
    UnauthorizedError:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ApiUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
    TimeEntry:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        clock_in:
          type: string
          format: date-time
        clock_out:
          type: string
          format: date-time
          nullable: true
        break_minutes:
          type: integer
        notes:
          type: string
          nullable: true
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LeaveRequest:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        leave_type:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        reason:
          type: string
          nullable: true
        status:
          type: string
        reviewed_by:
          type: integer
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        review_notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
