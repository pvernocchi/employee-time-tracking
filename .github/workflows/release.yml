name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    name: Bump version and create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: version
        run: |
          CURRENT=$(cat VERSION | tr -d '[:space:]')
          if [ -z "$CURRENT" ]; then
            CURRENT="0.0.0"
          fi
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)

          case "${{ github.event.inputs.release_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "$NEW_VERSION" > VERSION
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="$PREVIOUS_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          TAB=$(printf '\t')
          PRS_FILE=$(mktemp)
          SORTED_PRS_FILE=$(mktemp)

          for SHA in $(git rev-list --reverse "$RANGE"); do
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
              --jq '.[] | select(.merged_at != null) | [.number, .title, .html_url, .user.login] | @tsv' >> "$PRS_FILE"
          done

          sort -t "$TAB" -k1,1n -u "$PRS_FILE" > "$SORTED_PRS_FILE"

          {
            echo "## What's Changed"
            if [ -s "$SORTED_PRS_FILE" ]; then
              while IFS="$TAB" read -r NUMBER TITLE URL AUTHOR; do
                echo "- ${TITLE} by @${AUTHOR} in ${URL}"
              done < "$SORTED_PRS_FILE"
            else
              echo "- No merged pull requests found in this Release Diff."
            fi

            echo
            echo "## Contributors"
            if [ -s "$SORTED_PRS_FILE" ]; then
              cut -f4 "$SORTED_PRS_FILE" | sort -fu | while read -r AUTHOR; do
                echo "- @${AUTHOR}"
              done
            else
              echo "- No pull request contributors found for this release."
            fi

            if [ -n "$PREVIOUS_TAG" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${NEW_TAG}"
            fi
          } > release-notes.md

      - name: Commit VERSION file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }}"
          git push

      - name: Create and push tag
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: release-notes.md

  deploy:
    name: Deploy after release
    needs: release
    uses: ./.github/workflows/ftp-deploy.yml
    secrets: inherit
